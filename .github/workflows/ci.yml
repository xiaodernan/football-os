name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      # The shared cache tier, with the same host port and the same password the compose file
      # publishes. The app reads this and the second tier of the response cache becomes a real
      # server here instead of the in-memory fallback, which is what
      # `tests/test_redis_shared_tier.py`'s live case needs.
      REDIS_URL: redis://:football@localhost:63790/0
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: football_os
          POSTGRES_USER: football
          POSTGRES_PASSWORD: football
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Start the shared cache tier
        # The same image, the same password and the same host port as `infra/docker-compose.yml`'s
        # `redis` service, so the live shared-tier case runs here instead of skipping. The image's
        # own entrypoint takes the command, so `--requirepass` is the server's argument rather than
        # an entrypoint override.
        run: |
          docker run -d --name football_os_cache -p 63790:6379 redis:7-alpine redis-server --requirepass football
          for attempt in $(seq 1 30); do
            if docker exec football_os_cache redis-cli -a football ping 2>/dev/null | grep -q PONG; then
              break
            fi
            sleep 1
          done
          docker exec football_os_cache redis-cli -a football ping
      - name: Lint
        # The job's default working directory is apps/api; this step goes back to the repository root so it can
        # run the same file the local gate runs. `scripts/lint.sh` is the project's one lint target — it lints all
        # of apps/api plus every committed `.py` outside it, derived from `git ls-files` on every run. Naming a
        # target here instead is how the local gate and CI drifted apart three times, and why a committed tree
        # passed its own documented gate while four committed files went unread.
        working-directory: ${{ github.workspace }}
        run: bash scripts/lint.sh
      - name: Types
        run: python -m mypy app
      - name: Tests (SQLite dev fallback)
        run: python -m pytest
      - name: Migrations apply on PostgreSQL + pgvector
        env:
          DATABASE_URL: postgresql+psycopg2://football:football@localhost:5432/football_os
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m seed --with-demo-user
          python -c "from sqlalchemy import create_engine, text; e=create_engine('postgresql+psycopg2://football:football@localhost:5432/football_os'); c=e.connect(); print('tables:', len(c.execute(text(\"select 1\")).fetchall()) and [r[0] for r in c.execute(text(\"select tablename from pg_tables where schemaname='public'\"))])"
      # SQLite silently accepts over-length strings and lax types, so the same suite runs again
      # against the database production uses.
      - name: Tests (PostgreSQL + pgvector)
        env:
          DATABASE_URL: postgresql+psycopg2://football:football@localhost:5432/football_os
          FOOTBALL_OS_TEST_DATABASE_URL: postgresql+psycopg2://football:football@localhost:5432/football_os_test
        run: |
          # The name is a stem, not a database: conftest creates `<name>_<run uuid>` on this server,
          # installs `vector` in it and drops it afterwards, so two runs can never share a schema.
          python -m pytest
      # Spec §64: the RAG benchmark is the reviewer for any change to retrieval, chunking or the
      # corpus. It fails the build when a gate drops, so an answer-quality regression cannot merge.
      - name: RAG evaluation gates (pgvector leg)
        env:
          DATABASE_URL: postgresql+psycopg2://football:football@localhost:5432/football_os
        run: python -m evals.run_rag_eval

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Refusal-shape gate (the shipped reader vs this API's own answers)
        # Same command as `scripts/check.sh`; no server, no browser, so it can fail a build before `Types` does.
        # The bodies it asserts are `apps/web/fixtures/refusals.json`, and the api job above proves each of those
        # bodies is what `app/core/errors.py` and the named doors actually answer.
        run: node scripts/qa-error-shape.mjs
      - name: Script-inventory gate (who checks the checkers)
        # Same command as `scripts/check.sh`. Reads files only — no server, no browser — so it fails a build here
        # rather than joining the live-tier walks. It is the reason a new file under apps/web/scripts cannot arrive
        # unaccounted for: either a runner names it or its own bytes prove why no runner can.
        run: node scripts/qa-gate-inventory.mjs
      - name: Middleware gating gate (which routes a signed-out reader reaches)
        # Same command as `scripts/check.sh`. It transpiles and calls middleware.ts's own `isProtected`, then asks
        # it of every page route, so a change to the matching logic — not just to the lists it reads — fails here.
        # It exists because prefix matching reached into /video/shared/<token> and /portfolio/shared/<token> and
        # answered 307 to /login for a reader holding a share link: the one reader those pages are written for.
        run: node scripts/qa-middleware-gating.mjs
      - name: Metadata-title gate (every page's tab agrees with its own heading, or is ledgered)
        # Same command as `scripts/check.sh`. §81 2c's rule stated permanently over the whole page population instead
        # of against one change's diff: the population, the literal ceiling and the two exemptions are re-derived
        # from the parsed bytes on every run, so a shrinking scan or a stale exemption fails the build. Files only.
        run: node scripts/qa-metadata-title.mjs
      - name: English-literal gate (the copy the catalogues do not carry may only fall)
        # Same command as `scripts/check.sh`. The count of English copy written in the source, over every
        # `app/**/*.tsx`, parsed with the repo's own TypeScript: JSX text, label-ish attributes and label-ish
        # object properties are three shapes and the gate reads all three. The ceiling only falls — wiring a page
        # to its catalogue lowers it, and a page that adds copy in English raises it. Files only.
        run: node scripts/qa-i18n-literals.mjs
      - name: Catalogue-ICU gate (every message parses, and asks for the same values in every locale)
        # Same command as `scripts/check.sh`. A catalogue message is a program, not a string: next-intl parses
        # it when the page renders it, and a message that does not parse throws instead of printing. Nothing in
        # the build reads a catalogue, so a malformed message compiles, typechecks, lints and then 500s the page
        # that reads it. This parses every message in all three catalogues with the app's own ICU parser, refuses
        # a plural or select with no "other" branch, and holds the same key to the same placeholders everywhere.
        # It found five messages written with mustache placeholders ({{count}}), which ICU reads as an argument
        # that never began. Files only.
        run: node scripts/qa-icu-messages.mjs
      - name: Catalogue dead-key gate (every key is asked for, or the floor falls)
        # Same command as `scripts/check.sh`. The copy gate asks whether every key the source asks for IS in
        # the catalogue; this asks whether every key the catalogue holds is ASKED FOR. Only one of the two was
        # ever written, so the catalogue could hold 3736 keys while the tree read 3510 and every gate in the
        # suite would still have said the catalogue was complete. A key nothing reads is a translation that
        # ships to nobody — written three times and re-read whenever the message beside it changes. Every read
        # in the tree is resolved (a translator is identified by its binding; a read whose argument cannot be
        # resolved exempts its whole namespace rather than being guessed at), and the count may only fall.
        # Files only.
        run: node scripts/qa-unused-keys.mjs
      - name: Locale-token gate (the values that are the same in every language, and only those)
        # Same command as `scripts/check.sh`. Two claims in this project were conventions rather than
        # measurements. "The identical values are the ones that are supposed to be identical" was never
        # checked, so an English *phrase* could sit in the Chinese catalogue untranslated -- a Chinese reader
        # saw "weekly minutes" as a cap's name, and "pressing, transitions" as an example of what to type.
        # The set of identical values is now named, key by key, with the reason each one is the same in
        # every language, and a key that is not named is a finding. And "the English catalogue is English" was
        # never checked either: `en.json` held a Chinese sentence, so an English reader saw Chinese, and the
        # Chinese copy of it made the coverage figures call it translated. Files only.
        run: node scripts/qa-locale-tokens.mjs
      - name: API-string gate (the API's sentences, and the copies the web tier holds)
        # Same command as `scripts/check.sh`. The dead-key gate above asks whether every key the
        # catalogue holds is asked for; this asks the same question of the other side of the wire --
        # the API publishes sentences, the web tier reads them, and where else does the web tier hold a
        # copy? A copy in the web tier's own code is a dead string: the API's sentence is the live one,
        # so the API's wording could change and the page would not follow it. The API's refusal
        # sentences reach the web tier through the catalogue, so the catalogue is the source of truth
        # and the gate reads them from there. It also holds that the refusal boundary is wired on both
        # paths a refusal arrives through, and that every refusal code's sentence is translated in both
        # Chinese catalogues. Files only.
        run: node scripts/qa-api-strings.mjs
      - name: Error-boundary gate (the tree holds a failure boundary, in the reader's language)
        # Same command as `scripts/check.sh`. A page that throws is caught by the framework's own error
        # screen unless the tree holds a boundary, and that screen is English in every language. The
        # tree had a not-found page in the reader's language and no boundary at all. This holds that the
        # boundary is there, that it is a client component, and that its sentences are in the catalogue
        # in all three languages. Files only.
        run: node scripts/qa-error-boundary.mjs
      - name: Field-name gate (two fields on one page may not share a name)
        # Same command as `scripts/check.sh`. The copy gate above counts English literals; it cannot see a
        # catalogue key used for the wrong field, which is how the scout's shortlist and the scout's transfer
        # panel came to share one accessible name. This reads every page's own component graph and refuses two
        # different components on one page declaring the same constant aria-label key. Files only.
        run: node scripts/qa-field-labels.mjs
      - name: Cookie-proxy gate (a browser may only reach the API through the proxy, and a caller's trace crosses it)
        # Same command as `scripts/check.sh`. The access token is httpOnly, so a browser may not hold it, and every
        # call it makes has to reach the API through the cookie proxy. This reads every fetch in the tree and
        # refuses one that names a target outside /api/. It also compiles and calls the proxy's trace-context
        # helper — a valid caller's traceparent/tracestate crosses unchanged, an invalid one is dropped and no id
        # is minted — and holds the route's three seams that carry it to the API. Files only.
        run: node scripts/qa-proxy-gate.mjs
      - name: Crawl-policy gate (gated routes disallowed, advertised routes reachable, Allow exceptions live)
        # Same command as `scripts/check.sh`. Three files split one decision — who may crawl what — and each only
        # described the others in prose. This transpiles and calls all three, reconciles them against every page's
        # own `robots:` declaration, and refuses the class it found: 8 session-gated pages in no disallowed prefix,
        # whose `noindex` a crawler never reads because a 307 carries no head. Files only.
        run: node scripts/qa-crawl-policy.mjs
      - name: ICU-coverage gate (every placeholder used in source is declared in catalogue)
        run: node scripts/qa-icu-coverage.mjs
      - name: Translation-freshness gate (no stale translations since baseline)
        run: node scripts/qa-translation-freshness.mjs
      - name: Population-floor gate (catalogue population never regresses)
        run: node scripts/qa-population-floor.mjs
      - name: Locale-formatting gate (date/number/currency format patterns are locale-appropriate)
        run: node scripts/qa-locale-formatting.mjs
      - name: Plural-select gate (ICU plural/select branches complete per locale)
        run: node scripts/qa-plural-select.mjs
      - name: Key-drift gate (semantic drift detection across namespaces)
        run: node scripts/qa-key-drift.mjs
      - name: Locale-content gate (locale-specific content differences tracked)
        run: node scripts/qa-locale-content.mjs
      - name: Locale-completeness gate (every namespace has identical keys in all three locales)
        run: node scripts/qa-locale-completeness.mjs
      - name: Token-drift gate (named technical tokens remain stable)
        run: node scripts/qa-token-drift.mjs
      - name: Namespace-ownership gate (every namespace has a declared owner and purpose)
        run: node scripts/qa-namespace-ownership.mjs
      - name: Shared-key gate (each shared key across namespaces is named with its reason)
        run: node scripts/qa-shared-keys.mjs
      - name: Types
        run: npm run typecheck
      - name: Build
        run: npm run build
