# football-edge — the settings the edge runs with, reviewable in the diff.
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: core-api
              # Same default as the edge's own application.yml: discover the core by name, fall
              # back to a fixed address only when APC_CORE_URI is set.
              order: 0
              uri: ${apc.core-uri:lb://football-core}
              predicates:
                - Path=/api/v1/**
              filters:
                # CircuitBreaker is the outer filter: one caller request is one breaker observation,
                # however many attempts Retry makes underneath it. Retry is the inner one, so a
                # transient 503 heals itself without the breaker counting three failures for one caller.
                - name: CircuitBreaker
                  args:
                    name: coreBreaker
                    fallbackUri: forward:/edge/fallback
                - name: Retry
                  args:
                    retries: 2
                    # The stock default is the whole SERVER_ERROR series; clearing it and naming two
                    # statuses keeps 500 (a real application error) from being replayed three times.
                    series: []
                    statuses:
                      - SERVICE_UNAVAILABLE
                      - BAD_GATEWAY
                    methods:
                      - GET
                    backoff:
                      firstBackoff: 20ms
                      maxBackoff: 80ms
                      factor: 2
                      basedOnPreviousValue: false
            - id: web
              # The shell, through the same door; the catch-all is matched last.
              order: 10
              uri: ${apc.web-uri:http://localhost:3000}
              predicates:
                - Path=/**

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        # Must be reachable inside the window: the stock 100 with a window of 10 could never open.
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

# The same policy the edge carries by default, kept here so the config server serves one reviewable
# copy: how much one caller may burst, and how fast the bucket refills.
edge:
  plane:
    notice: ${PLANE_NOTICE:one door, one trace}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    burst: ${RATE_LIMIT_BURST:100}
    requests-per-second: ${RATE_LIMIT_RPS:50}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,refresh
  endpoint:
    health:
      show-details: always
