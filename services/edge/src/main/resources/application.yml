server:
  port: ${EDGE_PORT:8080}

spring:
  application:
    name: football-edge
  config:
    # Optional on purpose: a developer running only the edge still gets a working gateway, and the
    # config server, when it is up, is the source of the shared settings.
    import: optional:configserver:${CONFIG_URL:http://localhost:8888}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: core-api
              # The API door is matched first. By default the route asks the registry where the core is,
              # by name. Setting APC_CORE_URI (or -Dapc.core-uri=) switches to a hand-written address
              # without a registry, which is what the direct-routing test and a single-process dev run use.
              order: 0
              uri: ${apc.core-uri:lb://football-core}
              predicates:
                - Path=/api/v1/**
              filters:
                # CircuitBreaker is the outer filter: one caller request is one breaker observation,
                # however many attempts Retry makes underneath it. Retry is the inner one, so a
                # transient 503 heals itself without the breaker counting three failures for one caller.
                - name: CircuitBreaker
                  args:
                    name: coreBreaker
                    fallbackUri: forward:/edge/fallback
                - name: Retry
                  args:
                    retries: 2
                    # The stock default is the whole SERVER_ERROR series; clearing it and naming two
                    # statuses keeps 500 (a real application error) from being replayed three times.
                    series: []
                    statuses:
                      - SERVICE_UNAVAILABLE
                      - BAD_GATEWAY
                    methods:
                      - GET
                    backoff:
                      firstBackoff: 20ms
                      maxBackoff: 80ms
                      factor: 2
                      basedOnPreviousValue: false
            # The web shell is the same product, so it gets the same door. The catch-all is last, so it
            # only sees what the API route did not claim; the edge's own /edge/** controllers are served
            # by Spring's request mappings, which are matched before any route.
            - id: web
              order: 10
              uri: ${apc.web-uri:http://localhost:3000}
              predicates:
                - Path=/**
          # The trace id is a global filter, not a route filter: a route added tomorrow is traced without
          # anyone remembering to add it.
          httpclient:
            connect-timeout: 1000
            response-timeout: 10s

# The rate limiter's shared store is named by Spring Boot's own relaxed binding (`SPRING_DATA_REDIS_HOST`
# and friends) in the deployment that has one. It is deliberately absent here: an empty host fails the
# connection factory at startup, and a gateway with no store must still boot with its local bucket.
eureka:
  client:
    service-url:
      defaultZone: ${REGISTRY_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 10
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# One caller may burst, then is asked to slow down. Sized so a browser page (dozens of calls) never
# notices, and a loop that asks thousands of times per second does. Keyed by the direct peer address.
edge:
  plane:
    notice: ${PLANE_NOTICE:one door, one trace}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    burst: ${RATE_LIMIT_BURST:100}
    requests-per-second: ${RATE_LIMIT_RPS:50}
    # The shared tier (M15). Off by default: a gateway that tries to reach a store nobody gave it pays a
    # timeout on every request to prove a configuration mistake. `docker compose --profile plane` turns it
    # on and names the cache container.
    distributed: ${RATE_LIMIT_DISTRIBUTED:false}
    store-timeout-ms: ${RATE_LIMIT_STORE_TIMEOUT_MS:250}
    # Only a peer inside these networks may name the caller in X-Forwarded-For. Same default as the core.
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:127.0.0.1/32,::1/128}
  # A bounded number of /api/v1/ requests in flight at once; everything beyond is refused
  # immediately in the product's shape instead of queued behind a slow core.
  bulkhead:
    enabled: ${BULKHEAD_ENABLED:true}
    max-concurrent-calls: ${BULKHEAD_MAX_CONCURRENT:16}
  # How the edge chooses between core instances (item 29). `p2c` draws two at random and keeps the one
  # whose measured latency is lower; `round-robin` restores Spring Cloud's stock balancer.
  lb:
    strategy: ${LB_STRATEGY:p2c}
    # The EWMA's learning rate. 0.3 means one answer moves the average by less than a third, which is
    # slow enough that a single unlucky request cannot exile an instance and fast enough that a real
    # slowdown is visible within a handful of requests.
    ewma-alpha: ${LB_EWMA_ALPHA:0.3}
    # The latency a healthy answer is expected to take. An instance never seen scores exactly this, so a
    # freshly registered one is neither promoted nor punished for being unknown.
    target-ms: ${LB_TARGET_MS:60}
    # Multiplied by the target for each consecutive failure: three failures put an instance far above any
    # real latency until it answers once, which is what "unusable" should score like.
    failure-penalty: ${LB_FAILURE_PENALTY:8}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        # Resilience4j's default minimum is 100 calls, and with a 10-call window that minimum can never
        # be reached — the breaker would stay CLOSED forever and its thresholds would be decoration.
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    configs:
      default:
        # The route's documented response-time budget is 10s; without this block the Spring Cloud
        # adapter's own 5s TimeLimiter cut every slow call first and blamed the core for it.
        timeoutDuration: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,refresh
  endpoint:
    health:
      show-details: always
