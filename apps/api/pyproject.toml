# Tooling config for the API. Dependencies live in requirements.txt (one manifest).

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
  # FastAPI's dependency-injection idiom is a call in a default argument.
  "B008",
  # Planning dates are deliberately local calendar dates (training day buckets), not instants.
  "DTZ011",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
plugins = ["sqlalchemy.ext.mypy.plugin", "pydantic.mypy"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:passlib.*"]
markers = [
  # These need a live external service. Each one skips itself when the service is
  # absent rather than failing, so a marker selects a class of test, not a class of
  # failure — which is why leaving it unregistered only produced a warning.
  "integration: talks to a live external service (Redis, a real port) and skips itself when none answers",
]
