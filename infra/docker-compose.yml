name: football-os

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: football_os_db
    # Docker Desktop restarts leave a container with no policy down, and the second database leg fails
    # with "connection refused" hours later with nothing in the repo to explain it.
    restart: unless-stopped
    environment:
      POSTGRES_DB: football_os
      POSTGRES_USER: football
      POSTGRES_PASSWORD: football
    ports:
      - "54321:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football -d football_os"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
