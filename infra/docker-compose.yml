name: football-os

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: football_os_db
    # Docker Desktop restarts leave a container with no policy down, and the second database leg fails
    # with "connection refused" hours later with nothing in the repo to explain it.
    restart: unless-stopped
    environment:
      POSTGRES_DB: football_os
      POSTGRES_USER: football
      POSTGRES_PASSWORD: football
    ports:
      - "54321:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football -d football_os"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The shared cache tier. It is here, and it is authenticated, for one reason: an open Redis on a
  # host that already publishes 6379 is a *different application's* cache, and pointing this
  # project at it would both fail the handshake and put this project's entries in someone else's
  # keyspace. The host port is 63790, not 6379, for that reason.
  #
  # `requirepass` is the point, not a hardening extra: the URL the app reads carries the
  # password, so the tier can be reached by the app and by nobody else. The password lives in
  # one place (the environment), and `apps/api/tests/test_redis_shared_tier.py` reads the same
  # file to prove the app, the compose and CI all name the same instance.
  redis:
    image: redis:7-alpine
    container_name: football_os_cache
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-football}
      # A cache keeps nothing across a restart, so it writes nothing to disk.
      - --save
      - ""
      - --appendonly
      - "no"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-football}
    ports:
      - "${REDIS_PORT:-63790}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The trace collector the API exports to when OTEL_EXPORTER_OTLP_ENDPOINT is set. It sits
  # behind a profile rather than in the default stack: the API stays silent without that
  # variable, so booting a collector by default would spend a container on a pipeline nothing
  # writes to. `docker compose --profile observability up -d otel-collector` starts it. The
  # ports are bound to loopback because this is a dev collector, not a shared backend.
  otel-collector:
    image: otel/opentelemetry-collector:0.111.0
    container_name: football_os_otel
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

volumes:
  db-data:
